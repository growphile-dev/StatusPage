services:
  web:
    build: ./app
    ports:
      - "5001:5000"
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=statuspage
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=SecurePass123!
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: "SecurePass123!"
      POSTGRES_DB: statuspage
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
